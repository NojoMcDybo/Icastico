<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icastico</title>
  </head>
  <body>
    <div class="workstation">
      <header class="topbar">
        <button class="library-button" id="library-button" type="button" title="Bibliothek (Strg+O)" aria-label="Bibliothek öffnen">
          <span class="library-button__icon" aria-hidden="true"></span>Bibliothek
        </button>
        <span class="brand">Icastico</span>
        <span class="doc-title" id="doc-title"></span>
        <span class="mode" id="mode">Auswahl</span>
        <button class="help-button" type="button" onclick="document.getElementById('help').hidden = false" title="Tastenbelegung (F1)">?</button>
      </header>
      <main class="canvas" id="canvas">
        <div class="pages" id="pages" aria-label="Partitur"></div>
      </main>
      <footer class="statusbar">
        <span id="status">Lädt …</span>
        <span class="meta" id="meta"></span>
      </footer>
      <div class="help" id="help" hidden></div>
      <div id="library" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
