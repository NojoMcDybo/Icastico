[package]
name = "icastico"
version = "0.1.0"
description = "Icastico – Notensatz als individuelle Workstation"
license = "GPL-3.0-or-later"
repository = "https://github.com/NojoMcDybo/Icastico"
edition = "2021"
rust-version = "1.77"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "icastico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
